<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Kontak</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            padding: 25px; 
            color: #4a5568; 
            background-color: #fff9fb;
            line-height: 1.6;
            text-align: center;
        }
        h1 { 
            color: #ff69b4; 
            font-size: 26px; 
            margin-bottom: 20px; 
        }
        .contact-card {
            background: white;
            border: 3px dashed #ffb6c1;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 192, 203, 0.2);
            max-width: 500px;
            margin: 0 auto;
            text-align: left;
        }
        .contact-card p {
            margin-bottom: 12px;
            font-weight: bold;
        }
        .emoji-big { 
            font-size: 40px; 
            margin-bottom: 15px; 
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="contact-card">
        <div class="emoji-big">💌 📞 📍</div>
        <h1>Kontak You're in Europe</h1>
        <p>📍 Alamat: Jl. Ice Skating No. 26</p>
        <p>📞 Telepon: 022-567345</p>
        <p>💌 Email: Youre_in_europe@example.com</p>
    </div>
</body>
</html>
